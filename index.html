<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synapse Scholar: Your AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
      .perspective-container {
        perspective: 1200px;
      }
      .prose { max-width: 100% !important; }

      /* New styles for the robust overlay code editor */
      .editor-wrapper {
        flex-grow: 1;
        display: flex;
        overflow: hidden;
        position: relative;
        background-color: #020617; /* slate-950 */
      }
      .editor-linenumbers {
        padding: 1rem;
        padding-right: 0.75rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        line-height: 1.5;
        color: #64748b; /* slate-500 */
        text-align: right;
        user-select: none;
        background-color: #0f172a; /* slate-900 */
        overflow-y: hidden; /* Synced with textarea scrolling */
      }
      .editor-main {
        flex-grow: 1;
        position: relative;
      }
      /* Both textarea and pre/code must have IDENTICAL typography and box model */
      .editor-textarea, .editor-pre, .editor-pre code {
        margin: 0;
        padding: 1rem;
        border: 0;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre;
        overflow-wrap: normal;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .editor-textarea {
        resize: none;
        background: transparent;
        color: transparent; /* Hide the actual text, caret color is what matters */
        caret-color: #e2e8f0;
        outline: none;
        z-index: 1; /* Textarea is on top */
        overflow-y: auto; /* This is the master scroller */
      }
      .editor-pre {
        pointer-events: none; /* Let clicks/scrolls pass through to textarea */
        z-index: 0; /* pre/code is behind */
        overflow: hidden; /* It's synced, not scrolled by user */
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              'brand-primary': '#020617', // slate-950
              'brand-secondary': '#0f172a', // slate-900
              'brand-accent': '#22d3ee', // cyan-400
              'brand-accent-dark': '#0891b2', // cyan-600
              'brand-text': '#e2e8f0', // slate-200
              'brand-text-muted': '#94a3b8', // slate-400
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/client": "https://esm.sh/react-dom@^19.1.0/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.9.0",
    "@google/genai/": "https://esm.sh/@google/genai@^1.9.0/",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/"
  }
}
</script>
</head>
  <body class="bg-brand-primary font-sans text-brand-text">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
